  <text x="800" y="246" fill="#1c1410" font-size="15" font-weight="500">What were the key findings in Q3?</text>

  <!-- assistant bubble -->
  <rect x="418" y="290" width="560" height="200" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="440" y="324" fill="#fff" fill-opacity="0.9" font-size="15">Revenue grew 18% quarter-over-quarter, driven mainly</text>
  <text x="440" y="348" fill="#fff" fill-opacity="0.9" font-size="15">by enterprise renewals. The report also flags:</text>
  <circle cx="448" cy="376" r="3" fill="#fb923c"/>
  <text x="460" y="381" fill="#fff" fill-opacity="0.8" font-size="15">Operating costs down 6% after vendor consolidation</text>
  <circle cx="448" cy="402" r="3" fill="#fb923c"/>
  <text x="460" y="407" fill="#fff" fill-opacity="0.8" font-size="15">Churn risk concentrated in the SMB segment</text>
  <line x1="440" y1="428" x2="956" y2="428" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="440" y="452" fill="#fff" fill-opacity="0.5" font-size="12" font-weight="600" letter-spacing="1.2">CITATIONS</text>
  <rect x="440" y="462" width="150" height="22" rx="11" fill="#f97316" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.5"/>
  <text x="515" y="477" fill="#fdba74" font-size="12" text-anchor="middle">q3-report.pdf · p. 4</text>
  <rect x="598" y="462" width="156" height="22" rx="11" fill="#f97316" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.5"/>
  <text x="676" y="477" fill="#fdba74" font-size="12" text-anchor="middle">q3-report.pdf · p. 12</text>
  <rect x="762" y="462" width="156" height="22" rx="11" fill="#f97316" fill-opacity="0.18" stroke="#fb923c" stroke-opacity="0.5"/>
  <text x="840" y="477" fill="#fdba74" font-size="12" text-anchor="middle">q3-report.pdf · p. 17</text>

  <!-- thinking -->
  <rect x="418" y="514" width="92" height="40" rx="14" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="444" cy="534" r="5" fill="#fb923c"/>
  <circle cx="464" cy="534" r="5" fill="#fb923c" fill-opacity="0.65"/>
  <circle cx="484" cy="534" r="5" fill="#fb923c" fill-opacity="0.35"/>

  <!-- input -->
  <rect x="418" y="642" width="718" height="50" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="440" y="673" fill="#fff" fill-opacity="0.4" font-size="15">Ask a question about your documents…</text>
  <rect x="1090" y="650" width="36" height="34" rx="10" fill="url(#accent)"/>
  <path d="M1100 667h16M1110 660l7 7-7 7" fill="none" stroke="#1c1410" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
